<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebShark Risk — AML Analyst Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ===== LIGHT MODE (Red / White / Blue) ===== */
  :root, [data-theme="light"]{
    --ink:#0B1F3A;
    --ink-2:#16325C;
    --paper:#F4F7FB;
    --card:#FFFFFF;
    --slate:#4A5C73;
    --slate-light:#7A8DA6;
    --line:#D0DBE8;
    --amber:#C41E3A;
    --amber-bg:#FDECEE;
    --red:#B22234;
    --red-bg:#FCE8EB;
    --sage:#1E4D8C;
    --sage-bg:#E8F0FA;
    --focus:#2B6CB0;
    --sidebar-text:#C5D4E8;
    --sidebar-muted:#8BA3C0;
    --sidebar-nav:#AFC2D9;
    --table-head:#F0F5FA;
    --table-hover:#EAF1F8;
    --neutral-bg:#E4ECF5;
    --banner-info-bg:#E8F0FA;
    --banner-info-fg:#16325C;
    --banner-info-bd:#B8CEE6;
    --banner-warn-fg:#8B1A2B;
    --banner-warn-bd:#F0C4CB;
    --btn-danger-hover:#8E1B29;
    --scroll-thumb:#A8B9CC;
    --ring-track:#E4ECF5;
  }

  /* ===== DARK MODE ===== */
  [data-theme="dark"]{
    --ink:#E8F0FA;
    --ink-2:#C5D4E8;
    --paper:#0B1220;
    --card:#121C2E;
    --slate:#9BB0C7;
    --slate-light:#7A90A8;
    --line:#243447;
    --amber:#E85A6B;
    --amber-bg:#3A1A22;
    --red:#EF4455;
    --red-bg:#3A1520;
    --sage:#5B9BD5;
    --sage-bg:#152A45;
    --focus:#5B9BD5;
    --sidebar-text:#C5D4E8;
    --sidebar-muted:#7A90A8;
    --sidebar-nav:#9BB0C7;
    --table-head:#152033;
    --table-hover:#1A2740;
    --neutral-bg:#1A2740;
    --banner-info-bg:#152A45;
    --banner-info-fg:#A8C8E8;
    --banner-info-bd:#2A4A6E;
    --banner-warn-fg:#F0A0A8;
    --banner-warn-bd:#5A2A35;
    --btn-danger-hover:#C93344;
    --scroll-thumb:#3A4F66;
    --ring-track:#243447;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Public Sans',system-ui,sans-serif;
    background:var(--paper);
    color:var(--ink);
    display:flex;
    min-height:100vh;
    font-size:14px;
    transition:background .2s, color .2s;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  /* ===== SIDEBAR ===== */
  .sidebar{
    width:232px;
    flex-shrink:0;
    background:#0B1F3A;
    color:var(--sidebar-text);
    display:flex;
    flex-direction:column;
    padding:20px 0;
    position:sticky;
    top:0;
    height:100vh;
  }
  [data-theme="dark"] .sidebar{background:#060E1A;}
  .brand{
    padding:0 20px 20px 20px;
    border-bottom:1px solid rgba(255,255,255,0.12);
    margin-bottom:14px;
  }
  .brand-mark{
    display:flex;align-items:center;gap:9px;
  }
  .brand-mark .dot{
    width:9px;height:9px;border-radius:2px;background:var(--red);
    transform:rotate(45deg);
    flex-shrink:0;
  }
  .brand-name{font-weight:800;font-size:16.5px;letter-spacing:0.2px;color:#fff;}
  .brand-sub{font-size:11px;color:var(--sidebar-muted);margin-top:3px;letter-spacing:0.4px;text-transform:uppercase;}

  nav{display:flex;flex-direction:column;gap:2px;padding:0 10px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 10px;
    border-radius:6px;
    color:var(--sidebar-nav);
    font-size:13.5px;
    font-weight:500;
    background:none;
    border:none;
    text-align:left;
    width:100%;
  }
  .nav-item .ic{width:16px;text-align:center;font-size:13px;opacity:0.85;}
  .nav-item:hover{background:rgba(255,255,255,0.07);color:#fff;}
  .nav-item.active{background:#16325C;color:#fff;}
  [data-theme="dark"] .nav-item.active{background:#1A2F4A;}
  .nav-item.active .ic{opacity:1;}
  .nav-badge{
    margin-left:auto;
    background:var(--red);
    color:#fff;
    font-size:10.5px;
    font-weight:700;
    padding:1px 6px;
    border-radius:20px;
    font-family:'IBM Plex Mono',monospace;
  }

  .sidebar-footer{
    margin-top:auto;
    padding:14px 20px 4px 20px;
    border-top:1px solid rgba(255,255,255,0.12);
    font-size:12px;
    color:var(--sidebar-muted);
  }
  .analyst-row{display:flex;align-items:center;gap:9px;margin-top:2px;}
  .analyst-avatar{
    width:26px;height:26px;border-radius:50%;
    background:var(--red);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:11px;
    flex-shrink:0;
  }
  .analyst-name{color:#E8F0FA;font-weight:600;font-size:12.5px;}
  .analyst-role{color:var(--sidebar-muted);font-size:11px;}

  /* Theme toggle */
  .theme-toggle{
    display:flex;align-items:center;gap:8px;
    margin:12px 20px 0 20px;
    padding:8px 10px;
    border-radius:8px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    cursor:pointer;
    color:var(--sidebar-nav);
    font-size:12.5px;
    font-weight:600;
    width:calc(100% - 40px);
  }
  .theme-toggle:hover{background:rgba(255,255,255,0.1);color:#fff;}
  .theme-toggle .toggle-track{
    margin-left:auto;
    width:36px;height:20px;border-radius:10px;
    background:rgba(255,255,255,0.15);
    position:relative;flex-shrink:0;
  }
  .theme-toggle .toggle-thumb{
    position:absolute;top:2px;left:2px;
    width:16px;height:16px;border-radius:50%;
    background:#fff;transition:transform .2s;
  }
  [data-theme="dark"] .theme-toggle .toggle-thumb{transform:translateX(16px);background:var(--red);}
  [data-theme="dark"] .theme-toggle .toggle-track{background:rgba(239,68,85,0.35);}

  /* ===== MAIN ===== */
  main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    background:var(--card);
    border-bottom:1px solid var(--line);
    padding:16px 28px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .topbar h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-0.2px;}
  .topbar .sub{color:var(--slate);font-size:12.5px;margin-top:3px;}
  .content{padding:24px 28px 60px 28px;flex:1;}

  /* ===== SHARED COMPONENTS ===== */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
  }
  .toolbar{
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;
  }
  .chip-filter{
    border:1px solid var(--line);
    background:var(--card);
    padding:6px 12px;
    border-radius:20px;
    font-size:12.5px;
    font-weight:600;
    color:var(--slate);
  }
  .chip-filter.active{background:var(--ink);color:var(--card);border-color:var(--ink);}
  [data-theme="dark"] .chip-filter.active{background:var(--sage);color:#fff;border-color:var(--sage);}
  .search-input{
    border:1px solid var(--line);
    border-radius:20px;
    padding:6px 14px;
    font-size:12.5px;
    font-family:inherit;
    min-width:220px;
    margin-left:auto;
    background:var(--card);
    color:var(--ink);
  }

  table{width:100%;border-collapse:collapse;}
  th{
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:var(--slate);
    font-weight:700;
    padding:10px 14px;
    border-bottom:1px solid var(--line);
    background:var(--table-head);
  }
  td{
    padding:11px 14px;
    border-bottom:1px solid var(--line);
    font-size:13px;
    vertical-align:middle;
  }
  tbody tr{cursor:pointer;transition:background .1s;}
  tbody tr:hover{background:var(--table-hover);}
  tbody tr:last-child td{border-bottom:none;}

  .badge{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11px;font-weight:700;
    padding:3px 9px;border-radius:20px;
    white-space:nowrap;
  }
  .badge-high{background:var(--red-bg);color:var(--red);}
  .badge-medium{background:var(--amber-bg);color:var(--amber);}
  .badge-low{background:var(--sage-bg);color:var(--sage);}
  .badge-neutral{background:var(--neutral-bg);color:var(--slate);}
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}

  .status-pill{
    font-size:11px;font-weight:600;padding:3px 10px;border-radius:5px;
    background:var(--neutral-bg);color:var(--ink-2);
  }

  .empty-state{
    text-align:center;padding:60px 20px;color:var(--slate);
  }
  .empty-state .big{font-size:32px;margin-bottom:8px;}

  /* ===== DASHBOARD ===== */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  .stat-card{padding:16px 18px;}
  .stat-card .num{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;}
  .stat-card .label{font-size:12px;color:var(--slate);margin-top:4px;font-weight:600;}
  .stat-card.accent-red .num{color:var(--red);}
  .stat-card.accent-amber .num{color:var(--amber);}
  .stat-card.accent-sage .num{color:var(--sage);}

  .section-title{
    font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;
    color:var(--slate);margin:26px 0 10px 0;
  }

  /* ===== CASE DETAIL ===== */
  .back-link{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12.5px;font-weight:600;color:var(--slate);
    background:none;border:none;padding:0;margin-bottom:14px;
  }
  .back-link:hover{color:var(--ink);}

  .case-header{
    display:flex;justify-content:space-between;align-items:flex-start;gap:20px;
    padding:18px 20px;margin-bottom:18px;flex-wrap:wrap;
  }
  .case-header .id-line{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--slate-light);margin-bottom:4px;}
  .case-header h2{margin:0;font-size:19px;}
  .case-header .scenario{color:var(--slate);font-size:13px;margin-top:4px;max-width:520px;}

  .deadline-ring{
    display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;
  }
  .deadline-ring svg{transform:rotate(-90deg);}
  .deadline-ring .ring-num{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:16px;}
  .deadline-ring .ring-label{font-size:10px;color:var(--slate);text-transform:uppercase;letter-spacing:0.4px;}
  .ring-wrap{position:relative;width:74px;height:74px;}
  .ring-wrap .ring-center{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  }

  .workflow-stepper{
    display:flex;align-items:center;gap:0;margin-bottom:20px;overflow-x:auto;padding-bottom:4px;
  }
  .step{
    display:flex;align-items:center;gap:8px;flex-shrink:0;
    padding:8px 14px 8px 8px;
  }
  .step .num{
    width:22px;height:22px;border-radius:50%;
    background:var(--neutral-bg);color:var(--slate);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;font-family:'IBM Plex Mono',monospace;
    flex-shrink:0;
  }
  .step.done .num{background:var(--sage);color:#fff;}
  .step.current .num{background:var(--ink);color:#fff;}
  [data-theme="dark"] .step.current .num{background:var(--sage);color:#fff;}
  .step .step-label{font-size:12px;font-weight:600;color:var(--slate);white-space:nowrap;}
  .step.done .step-label,.step.current .step-label{color:var(--ink);}
  .step-connector{width:24px;height:1px;background:var(--line);flex-shrink:0;}

  .case-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start;}
  @media(max-width:980px){.case-grid{grid-template-columns:1fr;}}

  .panel{padding:16px 18px;margin-bottom:16px;}
  .panel h3{margin:0 0 12px 0;font-size:13px;text-transform:uppercase;letter-spacing:0.4px;color:var(--slate);}
  .kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;}
  .kv-grid .k{font-size:11px;color:var(--slate-light);text-transform:uppercase;letter-spacing:0.3px;}
  .kv-grid .v{font-size:13px;font-weight:600;margin-top:2px;}
  .kv-grid .full{grid-column:1/-1;}

  .flag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}

  .tx-amount{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .tx-amount.debit{color:var(--red);}
  .tx-amount.credit{color:var(--sage);}
  .tx-flagged{background:var(--amber-bg) !important;}

  .related-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;
  }
  .related-item:last-child{border-bottom:none;}
  .related-item .reason{color:var(--slate);font-size:11px;}

  .typology-check{
    display:flex;align-items:flex-start;gap:10px;
    padding:9px 0;border-bottom:1px solid var(--line);
  }
  .typology-check:last-child{border-bottom:none;}
  .typology-check input{margin-top:3px;}
  .typology-check .t-name{font-weight:600;font-size:12.5px;}
  .typology-check .t-desc{font-size:11.5px;color:var(--slate);margin-top:1px;}

  textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    line-height:1.6;
    resize:vertical;
    min-height:130px;
  }
  textarea:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}
  .char-count{font-size:11px;color:var(--slate-light);margin-top:6px;text-align:right;}

  .btn{
    border:none;border-radius:7px;padding:9px 16px;font-size:13px;font-weight:700;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn-primary{background:var(--ink);color:var(--card);}
  [data-theme="dark"] .btn-primary{background:var(--sage);color:#fff;}
  .btn-primary:hover{background:var(--ink-2);}
  [data-theme="dark"] .btn-primary:hover{background:#4A8BC4;}
  .btn-danger{background:var(--red);color:#fff;}
  .btn-danger:hover{background:var(--btn-danger-hover);}
  .btn-ghost{background:none;border:1px solid var(--line);color:var(--ink);}
  .btn-ghost:hover{background:var(--table-hover);}
  .btn-sm{padding:6px 12px;font-size:12px;border-radius:6px;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .action-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}

  .banner{
    display:flex;gap:10px;align-items:flex-start;
    padding:12px 14px;border-radius:8px;font-size:12.5px;margin-bottom:16px;
  }
  .banner-info{background:var(--banner-info-bg);color:var(--banner-info-fg);border:1px solid var(--banner-info-bd);}
  .banner-warn{background:var(--amber-bg);color:var(--banner-warn-fg);border:1px solid var(--banner-warn-bd);}
  .banner strong{display:block;margin-bottom:2px;}

  /* toast */
  #toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#0B1F3A;color:#fff;padding:11px 20px;border-radius:8px;
    font-size:13px;font-weight:600;opacity:0;pointer-events:none;
    transition:opacity .2s, transform .2s;
    z-index:100;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
  }
  [data-theme="dark"] #toast{background:#1A2F4A;color:#E8F0FA;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* KYC detail */
  .risk-meter{display:flex;gap:3px;margin-top:6px;}
  .risk-meter span{width:22px;height:6px;border-radius:3px;background:var(--line);}
  .risk-meter.low span:nth-child(1){background:var(--sage);}
  .risk-meter.medium span:nth-child(1),.risk-meter.medium span:nth-child(2){background:var(--amber);}
  .risk-meter.high span{background:var(--red);}

  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}

  textarea{
    background:var(--card);
    color:var(--ink);
  }

  @media (max-width:760px){
    .sidebar{position:fixed;left:-232px;transition:left .2s;z-index:50;}
    .sidebar.open{left:0;}
    .stat-grid{grid-template-columns:1fr 1fr;}
    .content{padding:18px 14px 60px 14px;}
    .topbar{padding:14px 16px;}
  }
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="brand-mark">
      <span class="dot"></span>
      <span class="brand-name">Casefile</span>
    </div>
    <div class="brand-sub">AML Analyst Workbench</div>
  </div>
  <nav id="nav"></nav>
  <button class="theme-toggle" id="themeToggle" type="button" onclick="toggleTheme()" title="Toggle light / dark mode">
    <span id="themeToggleLabel">Dark mode</span>
    <span class="toggle-track"><span class="toggle-thumb"></span></span>
  </button>
  <div class="sidebar-footer">
    <div style="text-transform:uppercase;letter-spacing:0.4px;font-size:10.5px;">Signed in as</div>
    <div class="analyst-row">
      <div class="analyst-avatar">SR</div>
      <div>
        <div class="analyst-name">S. Reyes</div>
        <div class="analyst-role">AML Analyst I</div>
      </div>
    </div>
  </div>
</aside>

<main>
  <div class="topbar">
    <div>
      <h1 id="pageTitle">Dashboard</h1>
      <div class="sub" id="pageSub">Queue overview and items needing attention</div>
    </div>
  </div>
  <div class="content" id="content"></div>
</main>

<div id="toast"></div>

function initializeWorkflowData(){
  alerts.forEach(a=>{
    if(!Array.isArray(a.typologies)) a.typologies = [];
    if(typeof a.triageNotes !== "string") a.triageNotes = "";
    if(typeof a.qcReviewed !== "boolean") a.qcReviewed = !!a.qcReviewed;
    if((a.status === "Cleared" || a.status === "Escalated") && !a.disposition){
      a.disposition = a.status === "Cleared" ? "Clear" : "Escalate";
    }
    if(a.status !== "New" && !a.triageStartedAt){
      a.triageStartedAt = a.generatedDate;
    }
  });

  sars.forEach(s=>{
    if(!s.qaChecks){
      s.qaChecks = {
        facts:false,
        chronology:false,
        counterparties:false,
        confidentiality:false
      };
    }
  });

  ctrRecords.forEach(r=>{
    if(typeof r.reviewNote !== "string") r.reviewNote = r.note || "";
  });

  sanctionsHits.forEach(h=>{
    if(typeof h.resolutionNote !== "string") h.resolutionNote = h.note || "";
  });

  if(!Array.isArray(auditLog)) auditLog = [];
}

function replaceArrayInPlace(target, source){
  target.splice(0, target.length, ...source);
}

function loadAppState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const parsed = JSON.parse(raw);
    if(Array.isArray(parsed.customers)) replaceArrayInPlace(customers, parsed.customers);
    if(Array.isArray(parsed.alerts)) replaceArrayInPlace(alerts, parsed.alerts);
    if(Array.isArray(parsed.sars)) replaceArrayInPlace(sars, parsed.sars);
    if(Array.isArray(parsed.ctrRecords)) replaceArrayInPlace(ctrRecords, parsed.ctrRecords);
    if(Array.isArray(parsed.sanctionsHits)) replaceArrayInPlace(sanctionsHits, parsed.sanctionsHits);
    if(Array.isArray(parsed.auditLog)) auditLog = parsed.auditLog;
    if(parsed.state && typeof parsed.state === "object"){
      if(typeof parsed.state.alertFilter === "string") state.alertFilter = parsed.state.alertFilter;
      if(typeof parsed.state.alertSearch === "string") state.alertSearch = parsed.state.alertSearch;
      if(typeof parsed.state.view === "string") state.view = parsed.state.view;
    }
  } catch(err){
    console.warn("Failed to load local app state", err);
  }
}

function saveAppState(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      customers,
      alerts,
      sars,
      ctrRecords,
      sanctionsHits,
      auditLog,
      state:{
        view:state.view,
        alertFilter:state.alertFilter,
        alertSearch:state.alertSearch
      }
    }));
  } catch(err){
    console.warn("Failed to save local app state", err);
  }
}

function recordAudit(entityType, entityId, transition, details, context){
  auditLog.push({
    id:`AUD-${Date.now()}-${Math.floor(Math.random()*1000)}`,
    ts:new Date().toISOString(),
    actor:ANALYST_NAME,
    entityType,
    entityId,
    transition,
    details,
    context:context || {}
  });
}

function formatAuditTs(ts){
  return new Date(ts).toLocaleString('en-US', {
    month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit'
  });
}

function getAuditForAlert(alertId, customerId){
  const rows = auditLog.filter(e=>
    (e.entityType === "alert" && e.entityId === alertId) ||
    (e.context && e.context.alertId === alertId) ||
    (e.context && e.context.customerId === customerId)
  );
  return rows.sort((a,b)=>new Date(b.ts)-new Date(a.ts));
}

function renderAuditPanel(entries){
  if(!entries.length){
    return `<div style="font-size:12.5px;color:var(--slate);">No workflow events logged yet for this case.</div>`;
  }
  return entries.slice(0,16).map(e=>`
    <div class="related-item" style="align-items:flex-start;">
      <div>
        <div style="font-weight:600;">${e.transition}</div>
        <div class="reason">${e.details}</div>
      </div>
      <div style="text-align:right;flex-shrink:0;">
        <div class="mono" style="font-size:11px;">${formatAuditTs(e.ts)}</div>
        <div class="reason">${e.actor}</div>
      </div>
    </div>
  `).join('');
}

/* =========================================================
   HELPERS
   ========================================================= */
function fmtMoney(n){
  const neg = n<0;
  const v = Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
  return (neg?"-":"") + "$" + v;
}
function fmtDate(d){
  return new Date(d+"T00:00:00").toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function todayISO(){
  return new Date().toISOString().slice(0,10);
}
function daysBetween(a,b){
  return Math.round((new Date(b) - new Date(a)) / 86400000);
}
function customerById(id){return customers.find(c=>c.id===id);}
function alertById(id){return alerts.find(a=>a.id===id);}
function priorAlertsFor(customerId, excludeId){
  return alerts.filter(a=>a.customerId===customerId && a.id!==excludeId);
}
function relatedCustomers(cust){
  return (cust.linked||[]).map(l=>({...l, cust:customerById(l.id)})).filter(x=>x.cust);
}
function badgeClass(priority){
  if(priority==="High") return "badge-high";
  if(priority==="Medium") return "badge-medium";
  return "badge-low";
}
function riskClass(r){
  if(r==="High") return "high"; if(r==="Medium") return "medium"; return "low";
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}
function setView(view, extra){
  state.view = view;
  Object.assign(state, extra||{});
  saveAppState();
  render();
  window.scrollTo({top:0,behavior:'instant'});
}

    </tr>`;
  });
  html += `</tbody></table></div>`;

  document.getElementById('content').innerHTML = html;
}

/* =========================================================
   RENDER: ALERT QUEUE (list)
   ========================================================= */
function renderAlertList(){
  let filtered = alerts;
  if(state.alertFilter!=="all"){
    filtered = filtered.filter(a=>a.status===state.alertFilter);
  }
  if(state.alertSearch){
    const q = state.alertSearch.toLowerCase();
    filtered = filtered.filter(a=>{
      const c = customerById(a.customerId);
      return a.id.toLowerCase().includes(q) || c.name.toLowerCase().includes(q) || a.scenario.toLowerCase().includes(q);
    });
  }
  filtered = [...filtered].sort((a,b)=>b.score-a.score);

  const statuses = ["all","New","In Review","Escalated","Cleared"];
  let toolbar = `<div class="toolbar">`;
  statuses.forEach(s=>{
    toolbar += `<button class="chip-filter ${state.alertFilter===s?'active':''}" onclick="setAlertFilter('${s}')">${s==="all"?"All":s}</button>`;
  });
  toolbar += `<input class="search-input" placeholder="Search alerts, customers, scenarios…" value="${state.alertSearch}" oninput="setAlertSearch(this.value)">`;
  toolbar += `</div>`;

  let table = `<div class="card"><table><thead><tr>
      <th>Alert</th><th>Customer</th><th>Scenario</th><th>Source</th><th>Score</th><th>Priority</th><th>Status</th>
    </tr></thead><tbody>`;
  if(filtered.length===0){
    table += `</tbody></table><div class="empty-state"><div class="big">🔍</div>No alerts match this filter.</div></div>`;
  } else {
    filtered.forEach(a=>{
      const c = customerById(a.customerId);
      table += `<tr onclick="openCase('${a.id}')">
        <td class="mono">${a.id}</td>
        <td>${c.name}</td>
        <td style="max-width:360px;color:var(--slate);">${a.scenario}</td>
        <td>${a.aiFlag ? '<span class="badge badge-neutral">AI/ML score</span>' : '<span class="badge badge-neutral">Rule-based</span>'}</td>
        <td class="mono">${a.score}</td>
        <td><span class="badge ${badgeClass(a.priority)}">${a.priority}</span></td>
        <td><span class="status-pill">${a.status}</span></td>
      </tr>`;
    });
    table += `</tbody></table></div>`;
  }

  document.getElementById('content').innerHTML = toolbar + table;
}
function setAlertFilter(f){ state.alertFilter = f; renderAlertList(); }
function setAlertSearch(v){ state.alertSearch = v; renderAlertList(); }
function openCase(alertId){ setView('alerts', {selectedAlertId:alertId}); }

/* =========================================================
   RENDER: CASE DETAIL
   ========================================================= */
function renderCaseDetail(alertId){
  const a = alertById(alertId);
  const c = customerById(a.customerId);
  const txs = (transactions[a.accountId]||[]).slice().sort((x,y)=> new Date(y.date)-new Date(x.date));
  const priors = priorAlertsFor(c.id, a.id);
  const related = relatedCustomers(c);

  const detected = new Date(a.generatedDate);
  const deadline = new Date(detected); deadline.setDate(deadline.getDate()+30);
  const today = new Date();
  const daysLeft = Math.max(0, daysBetween(today.toISOString().slice(0,10), deadline.toISOString().slice(0,10)));
  const pct = Math.max(0, Math.min(1, daysLeft/30));
  const ringColor = daysLeft<=7 ? 'var(--red)' : daysLeft<=15 ? 'var(--amber)' : 'var(--sage)';
  const circumference = 2*Math.PI*30;
  const dash = circumference*pct;

  const triageNoteLen = (a.triageNotes || "").trim().length;
  const typologyCount = (a.typologies || []).length;
  const auditEntries = getAuditForAlert(a.id, c.id);

  const stepDone = {
    generation:true,
    triage: !!a.triageStartedAt || a.status!=="New",
    building: a.status!=="New" && triageNoteLen>=20,
    analysis: typologyCount>0,
    disposition: !!a.disposition,
    qc: a.status==="Cleared" && !!a.qcReviewed
  };
  function stepClass(key,label,current){
    let cls = "step";
    if(stepDone[key]) cls+=" done";
    if(current) cls+=" current";
    return `<div class="${cls}"><div class="num">${stepDone[key]?'✓':({generation:1,triage:2,building:3,analysis:4,disposition:5,qc:6})[key]}</div><div class="step-label">${label}</div></div>`;

  let html = `<button class="back-link" onclick="setView('alerts',{selectedAlertId:null})">← Back to alert queue</button>`;

  html += `<div class="card case-header">
    <div>

      <h2>${c.name}</h2>
      <div class="scenario">${a.scenario}</div>
      <div class="flag-row">
        <span class="badge ${badgeClass(a.priority)}">${a.priority} priority</span>
        <span class="badge badge-neutral">Score ${a.score}</span>
        <span class="status-pill">${a.status}</span>
        ${c.pep?'<span class="badge badge-high">PEP</span>':''}
        ${c.msb?'<span class="badge badge-medium">MSB</span>':''}

    </div>
    <div class="deadline-ring">
      <div class="ring-wrap">
        <svg width="74" height="74" viewBox="0 0 74 74">
          <circle cx="37" cy="37" r="30" fill="none" stroke="var(--ring-track)" stroke-width="7"/>
          <circle cx="37" cy="37" r="30" fill="none" stroke="${ringColor}" stroke-width="7"
            stroke-dasharray="${dash} ${circumference}" stroke-linecap="round"/>
        </svg>
        <div class="ring-center">
          <div class="ring-num" style="color:${ringColor}">${daysLeft}</div>
        </div>
      </div>
      <div class="ring-label">days to SAR deadline</div>
    </div>
  </div>`;

  html += `<div class="workflow-stepper">
    ${stepClass('generation','Generation',false)}<div class="step-connector"></div>
    ${stepClass('triage','Triage',a.status==='New')}<div class="step-connector"></div>
    ${stepClass('building','Case Building',a.status==='In Review')}<div class="step-connector"></div>
    ${stepClass('analysis','Typology Analysis',false)}<div class="step-connector"></div>
    ${stepClass('disposition','Disposition',a.status==='Escalated')}<div class="step-connector"></div>
    ${stepClass('qc','QC Review',a.status==='Cleared')}
  </div>`;

  html += `<div class="case-grid"><div>`;

  // transactions
  html += `<div class="card panel"><h3>Transaction history — ${a.accountId} (${txs.length} records shown)</h3>
    <table><thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Branch / Channel</th><th>Counterparty</th></tr></thead><tbody>`;
  txs.forEach(t=>{
    html += `<tr class="${t.flag?'tx-flagged':''}">
      <td class="mono">${fmtDate(t.date)}</td>
      <td>${t.type}</td>
      <td class="tx-amount ${t.dir}">${fmtMoney(t.amount)}</td>
      <td>${t.branch}</td>
      <td>${t.counterparty}</td>
    </tr>`;
  });
  html += `</tbody></table></div>`;

  // triage
  html += `<div class="card panel"><h3>Triage and case building</h3>`;
  if(a.status === "New"){
    html += `<div class="banner banner-warn"><div><strong>Triage not started</strong>Start triage before submitting a final disposition so your workflow history reflects review steps.</div></div>`;
  }
  html += `<textarea id="triageNotes" placeholder="Capture initial findings: why this alert fired, what behavior is unusual, and what evidence you validated...">${a.triageNotes || ""}</textarea>
    <div class="char-count"><span id="triageCharCount">${(a.triageNotes || "").length}</span> characters</div>
    <div class="action-row">
      <button class="btn btn-ghost" onclick="saveTriageNotes('${a.id}')">Save triage notes</button>
      <button class="btn btn-primary" onclick="startInvestigation('${a.id}')" ${a.status!=="New" ? "disabled" : ""}>Start investigation</button>
    </div>`;
  html += `</div>`;

  // typology analysis
  html += `<div class="card panel"><h3>Typology analysis</h3>
    <p style="font-size:12.5px;color:var(--slate);margin-top:0;">Check any patterns supported by the transaction history above.</p>`;
  typologyOptions.forEach(t=>{
    const checked = (a.typologies || []).includes(t.key) ? "checked" : "";
    html += `<label class="typology-check">
      <input type="checkbox" id="typ-${t.key}" ${checked} onchange="toggleTypology('${a.id}','${t.key}',this.checked)">
      <div><div class="t-name">${t.name}</div><div class="t-desc">${t.desc}</div></div>
    </label>`;
  });
  html += `<div style="font-size:12px;color:var(--slate);margin-top:10px;">${typologyCount} typolog${typologyCount===1?"y":"ies"} selected.</div>`;
  html += `</div>`;

  // disposition
  html += `<div class="card panel"><h3>Disposition</h3>`;
  if(a.status==="Cleared" || a.status==="Escalated"){
    html += `<div class="banner ${a.status==='Cleared'?'banner-info':'banner-warn'}">

    </div>`;
    if(a.narrative){
      html += `<div class="mono" style="font-size:12px;line-height:1.7;color:var(--ink-2);background:var(--table-head);border:1px solid var(--line);border-radius:8px;padding:12px;">${a.narrative}</div>`;
    }
    html += `<div class="action-row" style="margin-top:12px;">
      <button class="btn btn-ghost btn-sm" onclick="markQcReviewed('${a.id}')" ${a.qcReviewed?"disabled":""}>${a.qcReviewed?"QC review completed":"Mark QC review complete"}</button>

    </div>`;
  } else {
    html += `<textarea id="dispositionNarrative" placeholder="Write a factual, chronological narrative explaining your disposition decision…">${a.dispositionDraft || ""}</textarea>
      <div class="char-count"><span id="charCount">${(a.dispositionDraft || "").length}</span> characters</div>
      <div class="action-row">
        <button class="btn btn-primary" onclick="disposeCase('${a.id}','Clear')">Clear / Close</button>
        <button class="btn btn-danger" onclick="disposeCase('${a.id}','Escalate')">Escalate to SAR</button>

  html += `</div><div>`; // right column

    <div class="kv-grid">
      <div><div class="k">Customer ID</div><div class="v mono">${c.id}</div></div>
      <div><div class="k">Type</div><div class="v">${c.type}</div></div>
      <div><div class="k">Risk rating</div><div class="v">${c.riskRating}<div class="risk-meter ${riskClass(c.riskRating)}"><span></span><span></span><span></span></div></div></div>
      <div><div class="k">Jurisdiction</div><div class="v">${c.jurisdiction}</div></div>
      <div class="full"><div class="k">Occupation / business</div><div class="v">${c.occupation}</div></div>
      <div class="full"><div class="k">Expected activity</div><div class="v" style="font-weight:500;">${c.expectedActivity}</div></div>
      <div class="full"><div class="k">Source of funds</div><div class="v" style="font-weight:500;">${c.sourceOfFunds}</div></div>
      <div><div class="k">Account opened</div><div class="v mono">${c.acctOpened}</div></div>
      <div><div class="k">Next CDD review</div><div class="v mono">${c.nextReview}</div></div>
    </div>
    ${(c.pep||c.msb||(c.flags&&c.flags.length))?`<div class="flag-row">
      ${c.pep?'<span class="badge badge-high">Politically Exposed Person</span>':''}
      ${c.msb?'<span class="badge badge-medium">Money Service Business</span>':''}
      ${(c.flags||[]).map(f=>`<span class="badge badge-medium">${f}</span>`).join('')}
    </div>`:''}
    <div class="action-row"><button class="btn btn-ghost btn-sm" onclick="setView('kyc',{selectedCustomerId:'${c.id}'})">Open full KYC profile →</button></div>
  </div>`;

  // prior alerts
  html += `<div class="card panel"><h3>Prior alerts on this customer (${priors.length})</h3>`;
  if(priors.length===0){
    html += `<div style="font-size:12.5px;color:var(--slate);">No prior alert history on file.</div>`;
  } else {
    priors.forEach(p=>{
      html += `<div class="related-item">
        <div>
          <div class="mono" style="font-weight:600;">${p.id}</div>
          <div class="reason">${fmtDate(p.generatedDate)} · ${p.status}</div>
        </div>
        <span class="badge ${badgeClass(p.priority)}">${p.priority}</span>
      </div>`;
    });
  }
  html += `</div>`;

  // related accounts
  html += `<div class="card panel"><h3>Related-party accounts (${related.length})</h3>`;
  if(related.length===0){
    html += `<div style="font-size:12.5px;color:var(--slate);">No related-party links identified.</div>`;
  } else {
    related.forEach(r=>{
      html += `<div class="related-item">
        <div>
          <div style="font-weight:600;">${r.cust.name}</div>
          <div class="reason">${r.reason}</div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="setView('kyc',{selectedCustomerId:'${r.cust.id}'})">View</button>

  html += `<div class="card panel"><h3>Audit trail</h3>${renderAuditPanel(auditEntries)}</div>`;

  html += `</div></div>`; // close case-grid

  document.getElementById('content').innerHTML = html;

  const ta = document.getElementById('dispositionNarrative');

  const triageTa = document.getElementById('triageNotes');

function saveTriageNotes(alertId){
  const a = alertById(alertId);
  const ta = document.getElementById('triageNotes');
  if(!ta) return;
  a.triageNotes = ta.value;
  recordAudit("alert", a.id, "Triage notes updated", "Case-building notes were saved.", {alertId:a.id, customerId:a.customerId});
  saveAppState();
  showToast("Triage notes saved.");
  renderCaseDetail(alertId);
}

function startInvestigation(alertId){
  const a = alertById(alertId);
  if(a.status !== "New") return;
  const previousStatus = a.status;
  a.status = "In Review";
  a.triageStartedAt = todayISO();
  if((a.triageNotes || "").trim().length < 20){
    a.triageNotes = (a.triageNotes || "") + "Initial triage started; transaction pattern under analyst review.";
  }
  recordAudit("alert", a.id, `${previousStatus} -> ${a.status}`, "Investigation started from triage stage.", {alertId:a.id, customerId:a.customerId});
  saveAppState();
  showToast(`${a.id} moved to In Review.`);
  renderNav();
  renderCaseDetail(alertId);
}

function toggleTypology(alertId, key, checked){
  const a = alertById(alertId);
  const set = new Set(a.typologies || []);
  if(checked) set.add(key); else set.delete(key);
  a.typologies = Array.from(set);
  recordAudit("alert", a.id, "Typology selection changed", `${checked ? "Added" : "Removed"} typology: ${key}.`, {alertId:a.id, customerId:a.customerId});
  saveAppState();
  showToast("Typology selections updated.");
  renderCaseDetail(alertId);
}

function markQcReviewed(alertId){
  const a = alertById(alertId);
  a.qcReviewed = true;
  a.qcReviewedAt = todayISO();
  recordAudit("alert", a.id, "QC review completed", "Case was marked as quality-control reviewed.", {alertId:a.id, customerId:a.customerId});
  saveAppState();
  showToast(`${a.id} marked as QC reviewed.`);
  renderCaseDetail(alertId);
}

function disposeCase(alertId, action){
  const a = alertById(alertId);
  if(a.status === "New"){
    showToast("Start triage before disposition.");
    return;
  }
  const ta = document.getElementById('dispositionNarrative');
  const text = ta ? ta.value.trim() : "";
  if(text.length < 120){
    showToast("Add a narrative of at least 120 characters before submitting a disposition.");
    return;
  }
  if((a.typologies || []).length === 0){
    showToast("Select at least one typology before submitting a disposition.");
    return;
  }
  const previousStatus = a.status;
  if(action==="Clear"){
    a.status = "Cleared";
    a.disposition = "Clear";
    a.narrative = text;
    a.qcReviewed = false;
    recordAudit("alert", a.id, `${previousStatus} -> ${a.status}`, "Disposition submitted as Clear/Close.", {alertId:a.id, customerId:a.customerId});
    showToast(`${a.id} cleared and closed.`);
  } else {
    a.status = "Escalated";
    a.disposition = "Escalate";
    a.narrative = text;
    if(!sars.find(s=>s.alertId===a.id)){
      const sarId = "SAR-"+(2200+sars.length+Math.floor(Math.random()*90));
      sars.push({
        id:sarId,
        alertId:a.id,
        customerId:a.customerId,
        detectedDate:a.generatedDate,
        status:"Drafting",
        narrative:text,
        qaChecks:{facts:false,chronology:false,counterparties:false,confidentiality:false}
      });
      recordAudit("sar", sarId, "SAR draft created", `Created from alert ${a.id}.`, {alertId:a.id, customerId:a.customerId});
    }
    a.qcReviewed = false;
    recordAudit("alert", a.id, `${previousStatus} -> ${a.status}`, "Disposition submitted as Escalate to SAR.", {alertId:a.id, customerId:a.customerId});
    showToast(`${a.id} escalated. SAR draft created.`);
  }
  a.dispositionDraft = "";
  saveAppState();
  renderNav();
  renderCaseDetail(alertId);
}

function reopenCase(alertId){
  const a = alertById(alertId);
  const previousStatus = a.status;
  a.status = "In Review";
  a.disposition = null;
  a.qcReviewed = false;
  recordAudit("alert", a.id, `${previousStatus} -> ${a.status}`, "Case reopened for additional investigation.", {alertId:a.id, customerId:a.customerId});
  saveAppState();
  showToast(`${a.id} reopened for investigation.`);
  renderNav();
  renderCaseDetail(alertId);
}

      <label class="typology-check"><input type="checkbox" ${s.qaChecks.chronology?"checked":""} onchange="toggleSarCheck('${s.id}','chronology',this.checked)"><div><div class="t-name">Chronology complete</div><div class="t-desc">Timeline is chronological with key date markers.</div></div></label>
      <label class="typology-check"><input type="checkbox" ${s.qaChecks.counterparties?"checked":""} onchange="toggleSarCheck('${s.id}','counterparties',this.checked)"><div><div class="t-name">Counterparties identified</div><div class="t-desc">Entities, channels, and amounts are clearly identified.</div></div></label>
      <label class="typology-check"><input type="checkbox" ${s.qaChecks.confidentiality?"checked":""} onchange="toggleSarCheck('${s.id}','confidentiality',this.checked)"><div><div class="t-name">Confidentiality reminder reviewed</div><div class="t-desc">No customer-facing disclosure language included.</div></div></label>
    </div>
  </div></div>`;

  document.getElementById('content').innerHTML = html;
  const ta = document.getElementById('sarNarrative');
  ta.addEventListener('input', ()=>{ document.getElementById('sarCharCount').textContent = ta.value.length; });
}

function saveSar(id){
  const s = sars.find(x=>x.id===id);
  s.narrative = document.getElementById('sarNarrative').value;
  recordAudit("sar", s.id, "SAR draft updated", "Narrative draft was saved.", {alertId:s.alertId, customerId:s.customerId});
  saveAppState();
  showToast("Draft saved.");
}

function toggleSarCheck(id, key, checked){
  const s = sars.find(x=>x.id===id);
  s.qaChecks[key] = checked;
  recordAudit("sar", s.id, "SAR QA checklist updated", `${checked ? "Checked" : "Unchecked"} ${key}.`, {alertId:s.alertId, customerId:s.customerId});
  saveAppState();
  showToast("SAR QA checklist updated.");
}

function markSarStatus(id, status){
  const s = sars.find(x=>x.id===id);
  s.narrative = document.getElementById('sarNarrative').value;
  const previousStatus = s.status;

  const checks = Object.values(s.qaChecks || {}).filter(Boolean).length;
  if(status === "Ready for Review"){
    if(s.narrative.trim().length < 150){
      showToast("Expand the SAR narrative to at least 150 characters before review.");
      return;
    }
    if(checks < 3){
      showToast("Complete at least 3 QA checklist items before sending for review.");
      return;
    }
  }

  if(status === "Filed"){
    if(s.status !== "Ready for Review"){
      showToast("Set status to Ready for Review before filing.");
      return;
    }
    if(s.narrative.trim().length < 200){
      showToast("Expand the SAR narrative to at least 200 characters before filing.");
      return;
    }
    if(checks < 4){
      showToast("Complete all QA checklist items before marking filed.");
      return;
    }
    const linked = alertById(s.alertId);
    if(linked){
      linked.qcReviewed = true;
      linked.qcReviewedAt = todayISO();
    }
  }

  s.status = status;
  recordAudit("sar", s.id, `${previousStatus} -> ${s.status}`, "SAR workflow status updated.", {alertId:s.alertId, customerId:s.customerId});
  saveAppState();
  showToast(status==="Filed" ? `${s.id} marked filed via BSA E-Filing.` : `${s.id} sent for senior review.`);
  renderNav();
  renderSarDetail(id);
}

/* =========================================================
   RENDER: CTR MODULE
   ========================================================= */
function renderCtr(){
  let html = `<div class="banner banner-info"><div><strong>Reminder</strong>CTRs are required for any cash transaction (or same-day aggregate) over $10,000, filed within 15 days — no suspicion needed. Records flagged below sit just under the threshold and warrant a structuring review even though no CTR is auto-triggered.</div></div>`;
  html += `<div class="card"><table><thead><tr>
    <th>CTR</th><th>Customer</th><th>Date</th><th>Amount</th><th>Status</th><th>Structuring review</th>
  </tr></thead><tbody>`;
  ctrRecords.forEach(r=>{
    const c = customerById(r.customerId);
    html += `<tr>
      <td class="mono">${r.id}</td>
      <td>${c.name}</td>
      <td class="mono">${fmtDate(r.date)}</td>
      <td class="mono" style="font-weight:600;">${fmtMoney(r.amount)}</td>
      <td><span class="status-pill">${r.status}</span></td>
      <td>${r.structuring ? `<span class="badge badge-medium">Flagged</span>` : '<span style="color:var(--slate-light);">—</span>'}
      ${r.status === "Under Review" ? `<div class="action-row" style="margin-top:8px;">
        <button class="btn btn-ghost btn-sm" onclick="resolveCtr('${r.id}','Closed')">No CTR required</button>
        <button class="btn btn-danger btn-sm" onclick="resolveCtr('${r.id}','Escalated')">Escalate to alert</button>
      </div>` : ""}
      </td>
    </tr>`;
    if(r.reviewNote){
      html += `<tr><td></td><td colspan="5" style="color:var(--slate);font-size:12px;padding-top:0;">${r.reviewNote}</td></tr>`;
    }
  });
  html += `</tbody></table></div>`;
  document.getElementById('content').innerHTML = html;
}

function resolveCtr(id, status){
  const r = ctrRecords.find(x=>x.id===id);
  const previousStatus = r.status;
  if(status === "Closed"){
    r.status = "Closed";
    r.structuring = false;
    r.reviewNote = "Structuring reviewed and documented. No reportable single cash transaction or same-day aggregate requiring CTR filing.";
    showToast(`${r.id} closed with documented structuring review.`);
  } else {
    r.status = "Escalated";
    r.structuring = true;
    r.reviewNote = "Structuring concern escalated to transaction monitoring for alert generation and full case investigation.";
    const existing = alerts.find(a=>a.accountId===r.accountId && a.scenario.includes("CTR structuring follow-up"));
    if(!existing){
      const newAlertId = `ALT-${59000 + alerts.length + 1}`;
      alerts.push({
        id:newAlertId,
        customerId:r.customerId,
        accountId:r.accountId,
        generatedDate:todayISO(),
        scenario:"CTR structuring follow-up — aggregate cash activity below threshold requires enhanced review",
        priority:"Medium",
        status:"New",
        score:72,
        aiFlag:false,
        typologies:["structuring"],
        triageNotes:""
      });
      recordAudit("alert", newAlertId, "Created from CTR review", `Generated from ${r.id} escalation.`, {customerId:r.customerId});
      renderNav();
    }
    showToast(`${r.id} escalated to alert queue.`);
  }
  recordAudit("ctr", r.id, `${previousStatus} -> ${r.status}`, "CTR structuring workflow status updated.", {customerId:r.customerId});
  saveAppState();
  renderCtr();
}

/* =========================================================
   RENDER: KYC MODULE
   ========================================================= */
function renderKycList(){
  let html = `<div class="card"><table><thead><tr>
    <th>Customer</th><th>Type</th><th>Risk</th><th>PEP</th><th>MSB</th><th>Next review</th>
  </tr></thead><tbody>`;
  customers.forEach(c=>{
    html += `<tr onclick="setView('kyc',{selectedCustomerId:'${c.id}'})">
      <td>${c.name}</td>
      <td>${c.type}</td>
      <td><span class="badge ${c.riskRating==='High'?'badge-high':c.riskRating==='Medium'?'badge-medium':'badge-low'}">${c.riskRating}</span></td>
      <td>${c.pep?'Yes':'—'}</td>
      <td>${c.msb?'Yes':'—'}</td>
      <td class="mono">${c.nextReview}</td>
    </tr>`;
  });
  html += `</tbody></table></div>`;
  document.getElementById('content').innerHTML = html;
}

function renderKycDetail(customerId){
  const c = customerById(customerId);
  const related = relatedCustomers(c);
  const custAlerts = alerts.filter(a=>a.customerId===c.id);

  let html = `<button class="back-link" onclick="setView('kyc',{selectedCustomerId:null})">← Back to customer directory</button>`;
  html += `<div class="card case-header">
    <div>
      <div class="id-line">${c.id} · opened ${c.acctOpened}</div>
      <h2>${c.name}</h2>
      <div class="scenario">${c.type} · ${c.jurisdiction}</div>
      <div class="flag-row">
        <span class="badge ${c.riskRating==='High'?'badge-high':c.riskRating==='Medium'?'badge-medium':'badge-low'}">${c.riskRating} risk</span>
        ${c.pep?'<span class="badge badge-high">PEP</span>':''}
        ${c.msb?'<span class="badge badge-medium">MSB</span>':''}
      </div>
    </div>
  </div>`;

  html += `<div class="case-grid"><div>
    <div class="card panel"><h3>Identity (KYC)</h3>
      <div class="kv-grid">
        <div><div class="k">Full name / entity</div><div class="v">${c.name}</div></div>
        <div><div class="k">DOB / Formed</div><div class="v mono">${c.dob}</div></div>
        <div class="full"><div class="k">Address on file</div><div class="v">${c.address}</div></div>
        <div><div class="k">Phone</div><div class="v mono">${c.phone}</div></div>
        <div><div class="k">Primary account</div><div class="v mono">${c.accountId}</div></div>
      </div>
    </div>
    <div class="card panel"><h3>Due diligence (CDD${(c.riskRating==='High')?' / EDD':''})</h3>
      <div class="kv-grid">
        <div class="full"><div class="k">Occupation / business</div><div class="v">${c.occupation}</div></div>
        <div class="full"><div class="k">Source of funds</div><div class="v" style="font-weight:500;">${c.sourceOfFunds}</div></div>
        <div class="full"><div class="k">Expected activity</div><div class="v" style="font-weight:500;">${c.expectedActivity}</div></div>
        <div><div class="k">Last review</div><div class="v mono">${c.lastReview}</div></div>
        <div><div class="k">Next review due</div><div class="v mono">${c.nextReview}</div></div>
      </div>
      ${(c.flags&&c.flags.length)?`<div class="flag-row">${c.flags.map(f=>`<span class="badge badge-medium">${f}</span>`).join('')}</div>`:''}
    </div>
  </div><div>
    <div class="card panel"><h3>Alert history (${custAlerts.length})</h3>`;
  if(custAlerts.length===0){
    html += `<div style="font-size:12.5px;color:var(--slate);">No alerts on file.</div>`;
  } else {
    custAlerts.forEach(a=>{
      html += `<div class="related-item" onclick="setView('alerts',{selectedAlertId:'${a.id}'})" style="cursor:pointer;">
        <div><div class="mono" style="font-weight:600;">${a.id}</div><div class="reason">${fmtDate(a.generatedDate)}</div></div>
        <span class="status-pill">${a.status}</span>
      </div>`;
    });
  }
  html += `</div>
    <div class="card panel"><h3>Related-party accounts (${related.length})</h3>`;
  if(related.length===0){
    html += `<div style="font-size:12.5px;color:var(--slate);">No related-party links identified.</div>`;
  } else {
    related.forEach(r=>{
      html += `<div class="related-item">
        <div><div style="font-weight:600;">${r.cust.name}</div><div class="reason">${r.reason}</div></div>
        <button class="btn btn-ghost btn-sm" onclick="setView('kyc',{selectedCustomerId:'${r.cust.id}'})">View</button>
      </div>`;
    });
  }
  html += `</div>
    <div class="card panel"><h3>Review workflow</h3>
      <div style="font-size:12.5px;color:var(--slate);">Complete periodic review to update review timestamps and schedule the next due date based on risk tier.</div>
      <div class="action-row"><button class="btn btn-primary btn-sm" onclick="completeKycReview('${c.id}')">Complete periodic review</button></div>
    </div></div></div>`;

  document.getElementById('content').innerHTML = html;
}

function completeKycReview(customerId){
  const c = customerById(customerId);
  const previousNextReview = c.nextReview;
  c.lastReview = todayISO();
  const next = new Date();
  if(c.riskRating === "High") next.setDate(next.getDate()+365);
  else if(c.riskRating === "Medium") next.setDate(next.getDate()+540);
  else next.setDate(next.getDate()+730);
  c.nextReview = next.toISOString().slice(0,10);
  recordAudit("kyc", c.id, "Periodic review completed", `Review completed. Next review moved from ${previousNextReview} to ${c.nextReview}.`, {customerId:c.id});
  saveAppState();
  showToast(`Periodic review completed for ${c.id}.`);
  renderKycDetail(customerId);
}

/* =========================================================
   RENDER: SANCTIONS MODULE
   ========================================================= */
function renderSanctions(){
  let html = `<div class="card"><table><thead><tr>
    <th>Match</th><th>List source</th><th>Screened</th><th>Score</th><th>Status</th><th>Action</th>
  </tr></thead><tbody>`;
  sanctionsHits.forEach(h=>{
    html += `<tr>
      <td>${h.name}</td>
      <td>${h.listSource}</td>
      <td class="mono">${fmtDate(h.screenedDate)}</td>
      <td class="mono" style="font-weight:600;color:${h.matchScore>=80?'var(--red)':h.matchScore>=50?'var(--amber)':'var(--sage)'}">${h.matchScore}%</td>
      <td><span class="status-pill">${h.status}</span></td>
      <td>${h.status==="Pending Review" ? `
        <button class="btn btn-ghost btn-sm" onclick="resolveSanctions('${h.id}','False Positive')">False positive</button>
        <button class="btn btn-danger btn-sm" onclick="resolveSanctions('${h.id}','True Match — Escalated')">True match</button>
      ` : `
        <button class="btn btn-ghost btn-sm" onclick="resolveSanctions('${h.id}','Pending Review')">Reopen</button>
      `}</td>
    </tr>`;
    html += `<tr><td colspan="6" style="color:var(--slate);font-size:12px;padding-top:0;">${h.note}</td></tr>`;
  });
  html += `</tbody></table></div>`;
  document.getElementById('content').innerHTML = html;
}

function ensureSanctionsAlert(h){
  const customer = customers.find(c=>h.name.includes(c.name) || c.name.includes(h.name));
  if(!customer) return;
  const existing = alerts.find(a=>a.scenario.includes(h.id));
  if(existing) return;
  const newAlertId = `ALT-${59500 + alerts.length + 1}`;
  alerts.push({
    id:newAlertId,
    customerId:customer.id,
    accountId:customer.accountId,
    generatedDate:todayISO(),
    scenario:`Sanctions follow-up — confirmed list match ${h.id} requires enhanced review and disposition`,
    priority:"High",
    status:"Escalated",
    score:96,
    aiFlag:false,
    typologies:["layering"],
    triageNotes:"Sanctions hit confirmed and escalated for immediate review."
  });
  recordAudit("alert", newAlertId, "Created from sanctions resolution", `Generated from confirmed sanctions match ${h.id}.`, {customerId:customer.id});
}

function resolveSanctions(id, status){
  const h = sanctionsHits.find(x=>x.id===id);
  const previousStatus = h.status;
  h.status = status;
  h.note = status==="False Positive"
    ? "Resolved as false positive by analyst — identifying details do not correlate to listed entity."
    : status==="Pending Review"
      ? "Reopened for additional analyst review."
      : "Confirmed true match. Escalated to sanctions officer for block/freeze review.";
  if(status === "True Match — Escalated"){
    ensureSanctionsAlert(h);
    renderNav();
  }
  recordAudit("sanctions", h.id, `${previousStatus} -> ${h.status}`, "Sanctions screening status updated.", {});
  saveAppState();
  showToast(`${h.id} resolved: ${status}`);
  renderSanctions();
}

/* =========================================================
   MAIN RENDER DISPATCH
   ========================================================= */
function render(){
  renderNav();
  const [title, sub] = TITLES[state.view];
  document.getElementById('pageTitle').textContent = title;
  document.getElementById('pageSub').textContent = sub;

  if(state.view==="dashboard") renderDashboard();
  else if(state.view==="alerts"){
    if(state.selectedAlertId) renderCaseDetail(state.selectedAlertId);
    else renderAlertList();
  }
  else if(state.view==="sar"){
    if(state.selectedAlertId) renderSarDetail(state.selectedAlertId);
    else renderSarList();
  }
  else if(state.view==="ctr") renderCtr();
  else if(state.view==="kyc"){
    if(state.selectedCustomerId) renderKycDetail(state.selectedCustomerId);
    else renderKycList();
  }
  else if(state.view==="sanctions") renderSanctions();
}

loadAppState();
initializeWorkflowData();
applyTheme(getPreferredTheme());
render();
</script>
